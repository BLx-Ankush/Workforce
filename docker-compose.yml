version: '3.8'

services:
  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    container_name: workforce-optimizer
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workforce-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - OPTIMIZER_URL=http://optimizer:8001
      - MONGODB_URI=mongodb://mongo:27017/workforce_ai
      - JWT_SECRET=workforce_intelligence_hackathon_secret_2026
    depends_on:
      - optimizer
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workforce-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: workforce-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
